name: Admin Phase 1

on:
  push:
    paths:
      - 'src/screens/admin/**'
      - 'src/components/admin/**'
      - 'src/lib/admin-product-health.js'
      - 'src/lib/domeraAdminDb.js'
      - 'app/admin-login/**'
      - 'app/api/admin/**'
      - '.github/workflows/admin-phase1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build

name: Bootstrap DOMERA Next.js

on:
  push:
    branches:
      - agent/nextjs-ssr-migration
    paths:
      - .github/workflows/bootstrap-domera.yml

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/nextjs-ssr-migration

      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/part-00 \
            .bootstrap/part-01 \
            .bootstrap/part-02 \
            .bootstrap/part-03 \
            .bootstrap/part-04 \
            .bootstrap/part-05 \
            .bootstrap/part-06 \
            .bootstrap/part-07 \
            .bootstrap/part-08 \
            .bootstrap/part-09 \
            .bootstrap/part-10 \
            .bootstrap/part-11 \
            .bootstrap/part-12 \
            .bootstrap/part-13a \
            .bootstrap/part-13b \
            .bootstrap/part-14a \
            .bootstrap/part-14b > /tmp/domera.b64
          base64 --decode /tmp/domera.b64 > /tmp/domera.tar.xz
          echo "81d3d28e05a035a62c7f14a6715848f4ff5694353fb063ec7c56ba8b4c44dfd7  /tmp/domera.tar.xz" | sha256sum --check --strict
          mkdir -p /tmp/domera-src
          tar -xJf /tmp/domera.tar.xz -C /tmp/domera-src
          test "$(find /tmp/domera-src -type f | wc -l)" -eq 209
          test -f /tmp/domera-src/package.json
          test -f /tmp/domera-src/app/layout.jsx
          test -f /tmp/domera-src/app/sitemap.js
          test -f /tmp/domera-src/app/robots.js

      - name: Replace repository tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/domera-src/. .
          test "$(find . -type f -not -path './.git/*' | wc -l)" -eq 209

      - name: Commit clean Next.js migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace repository with DOMERA Next.js SSR migration"
          git push origin HEAD:agent/nextjs-ssr-migration

name: CRO Phase 2

on:
  push:
    paths:
      - '.github/workflows/cro-phase2.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply CRO Phase 2
        run: python3 tools/apply_cro_phase2.py
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build
        run: npm run build
      - name: Commit release
        run: |
          rm .github/workflows/cro-phase2.yml tools/apply_cro_phase2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: CRO phase 2 smart shopping experience"
          git push origin main

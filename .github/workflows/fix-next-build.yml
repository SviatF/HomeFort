name: Fix Next Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-next-build.yml'

permissions:
  contents: write

jobs:
  fix-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Move legacy page components out of Next pages router namespace
        run: |
          if [ -d src/pages ]; then
            mv src/pages src/screens
          fi
          grep -RIl "@/pages/" app src | xargs -r sed -i "s#@/pages/#@/screens/#g"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-next-build.yml

      - name: Commit build fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve Next.js app/pages directory conflict"
          git push origin main

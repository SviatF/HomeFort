name: UI A-F Refactor

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-ui-af-refactor.py'
      - 'src/ui-a-f.css'
      - 'src/components/domera/ProductCard.jsx'
      - 'src/components/domera/ProductGallery.jsx'
      - 'src/components/domera/ProductImage.jsx'
      - 'src/components/domera/FabricSelector.jsx'
      - 'src/lib/CartContext.jsx'
      - '.github/workflows/ui-a-f-refactor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply A-F refactor
        run: python3 scripts/apply-ui-af-refactor.py
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit generated UI changes
        run: |
          git config user.name 'DOMERA UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/screens/Product.jsx src/screens/Catalog.jsx src/components/domera/ProductConversionSections.jsx src/components/domera/ProductCard.jsx src/components/domera/ProductGallery.jsx src/components/domera/Header.jsx
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'feat: implement UI blocks A-F across storefront'
            git push
          fi

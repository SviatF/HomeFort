name: Finalize Homefort Dataset
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-homefort-dataset.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 lxml
      - name: Build final catalog data
        run: python scripts/scrape_homefort_beds_v5.py
      - name: Commit final data and cleanup
        run: |
          rm -f .github/workflows/finalize-homefort-dataset.yml
          rm -rf scripts/__pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: finalize 79 Homefort bed product records"
          git pull --rebase origin main
          git push origin main

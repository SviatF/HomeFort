name: Full CRO upgrade

on:
  push:
    paths:
      - 'scripts/apply-cro.py'
      - '.github/workflows/cro-full-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply CRO migration
        run: python3 scripts/apply-cro.py
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build
        run: npm run build
      - name: Commit release
        run: |
          rm -f scripts/apply-cro.py .github/workflows/cro-full-upgrade.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/Product.jsx src/screens/Checkout.jsx scripts/apply-cro.py .github/workflows/cro-full-upgrade.yml
          git commit -m "feat: full CRO upgrade for product and checkout"
          git push origin main

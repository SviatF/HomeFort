name: Semantic Core

on:
  push:
    paths:
      - 'scripts/patch_semantic_catalog.py'
      - 'src/lib/bed-semantic-core.js'
      - 'app/catalog/**'
      - 'app/sitemap.js'
      - 'src/lib/seo.js'
      - '.github/workflows/semantic-core.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply semantic catalog patch
        run: python scripts/patch_semantic_catalog.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit semantic release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/screens/Catalog.jsx
          if git diff --cached --quiet; then
            echo "No UI patch changes"
            exit 0
          fi
          git commit -m "feat: activate SEO semantic landing clusters"
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin HEAD:main

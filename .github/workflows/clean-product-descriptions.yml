name: Clean Product Descriptions

on:
  push:
    paths:
      - 'scripts/patch_product_description_ui.py'
      - 'scripts/clean_product_descriptions.py'
      - '.github/workflows/clean-product-descriptions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply UI patch
        run: python scripts/patch_product_description_ui.py
      - name: Clean approved descriptions
        run: python scripts/clean_product_descriptions.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit cleanup
        run: |
          git config user.name "DOMERA Content Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/screens/Product.jsx public/data/homefort-beds.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "content: clean and structure all product descriptions"
          git push

name: Finalize UI A-F

on:
  push:
    branches: [main]
    paths:
      - 'scripts/finalize-ui-af.py'
      - '.github/workflows/finalize-ui-af.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Finalize UI and product media
        run: python3 scripts/finalize-ui-af.py
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit final storefront changes
        run: |
          git config user.name 'DOMERA UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/screens/Product.jsx public/data/homefort-beds.json
          if git diff --cached --quiet; then
            echo 'No final changes'
          else
            git commit -m 'feat: finalize mobile PDP and real product media'
            git push
          fi
